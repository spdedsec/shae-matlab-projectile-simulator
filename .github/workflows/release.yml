name: GitHub Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify test suite passes
        run: |
          python3 -m unittest discover -s tests -v

      - name: Generate archives via Make build
        run: |
          make build

      - name: Upload release asset (tar.gz)
        uses: softprops/asset@v3
        with:
          name: shae-matlab-projectile-simulator-v${GITHUB_REF#refs/tags/v}.tar.gz
          path: dist/shae-matlab-projectile-simulator-v${GITHUB_REF#refs/tags/v}.tar.gz

      - name: Upload release asset (zip)
        uses: softprops/asset@v3
        with:
          name: shae-matlab-projectile-simulator-v${GITHUB_REF#refs/tags-v}.zip
          path: dist/shae-matlab-projectile-simulator-v${GITHUB_REF#refs/tags-v}.zip

      - name: Upload checksums
        uses: softprops/asset@v3
        with:
          name: shae-matlab-projectile-simulator-v${GITHUB_REF#refs/tags-v}.tar.gz.sha256
          path: dist/shae-matlab-projectile-simulator-v${GITHUB_REF#refs/tags-v}.tar.gz.sha256